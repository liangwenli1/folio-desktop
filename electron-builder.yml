# Installers: Windows NSIS (x64) and macOS dmg (Apple silicon), published to this repository's GitHub releases,
# where the app's update check and the site's download links find them. File names carry no version, so
# ".../releases/latest/download/<name>" always points at the newest release.
appId: app.folio.desktop
directories:
  buildResources: build
  output: release
files:
  - out/**
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Folio-Setup-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64]
    # Not downloaded by people; the update check reads the release's latest-mac.yml, which needs it.
    - target: zip
      arch: [arm64]
  artifactName: Folio-${arch}.${ext}
  category: public.app-category.productivity
  # Shown when macOS first asks to let Folio control System Events (tiling moves Firefox windows that way).
  extendInfo:
    NSAppleEventsUsageDescription: Folio moves Firefox windows when you tile the windows you sync.
  # No Developer ID certificate yet: an ad-hoc signature is what lets Apple silicon run the app at all. Once there
  # is a certificate (CSC_LINK and CSC_KEY_PASSWORD in the workflow), delete these two lines.
  identity: "-"
  hardenedRuntime: false
# Only for trying the packaged app on the Linux development machine; not released.
linux:
  target: [dir]
# The release workflow makes a draft for the tag first; electron-builder uploads into it.
publish:
  provider: github
