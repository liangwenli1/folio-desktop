# Pushing a tag v<version> (matching package.json) builds the Windows and macOS installers and publishes them as a
# GitHub release, where the app's update check and the site's download links find them. The release stays a draft
# until both installers are uploaded, so "latest" never points at a release without them.
#
# Repository variable FOLIO_URL: the Folio deployment the app talks to, e.g. https://folio.example.com
# Code signing (optional, see README): secrets CSC_LINK and CSC_KEY_PASSWORD (macOS Developer ID), WIN_CSC_LINK and
# WIN_CSC_KEY_PASSWORD (Windows). Unset, the builds are unsigned (macOS ad-hoc).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches package.json and FOLIO_URL is set
        env:
          FOLIO_URL: ${{ vars.FOLIO_URL }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" || { echo "::error::Tag $GITHUB_REF_NAME does not match the version in package.json"; exit 1; }
          case "$FOLIO_URL" in https://*) ;; *) echo "::error::Set the repository variable FOLIO_URL (e.g. https://folio.example.com)"; exit 1;; esac
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Folio ${GITHUB_REF_NAME#v}" --generate-notes

  build:
    needs: draft
    strategy:
      # Each system's result is worth having even when the other fails; the release is published only if both pass.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          # macos-latest runs on Apple silicon.
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    # Bash on Windows too: PowerShell splits arguments like -c.publish.repo=x at the dot.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          MAIN_VITE_FOLIO_URL: ${{ vars.FOLIO_URL }}
      - name: Package and upload to the draft release
        run: npx electron-builder ${{ matrix.target }} --publish always -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }}
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
